[project]
name = "edaptive-backend"
version = "0.1.0"
description = "Edaptive local backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "import-linter>=2.1",
  "datamodel-code-generator>=0.26",
  "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a running Postgres (DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Modules talk through contracts and the session log, never each other's internals"
type = "independence"
modules = [
  "app.modules.auth",
  "app.modules.curriculum",
  "app.modules.profiles",
  "app.modules.scheduling",
  "app.modules.assessment",
  "app.modules.consent",
  "app.modules.parent",
  "app.modules.attention",
  "app.modules.socratic",
  "app.modules.verification",
]

[[tool.importlinter.contracts]]
name = "Core and contracts never depend on feature modules"
type = "forbidden"
source_modules = ["app.core", "app.contracts"]
forbidden_modules = ["app.modules"]
